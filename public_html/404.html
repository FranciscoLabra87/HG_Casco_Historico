<style>
  :root {
    --serif-h1: "Cinzel", serif;
    --serif-h2: "Cormorant Garamond", serif;
    --sans: "Source Sans 3", system-ui, sans-serif;
  }
  .error-wrap {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 40px 16px;
  }
  .error-card {
    width: min(560px, 100%);
    padding: clamp(32px, 6vw, 56px);
    text-align: center;
    background: var(--hm-surface);
    border: 1px solid var(--hm-line);
    border-radius: var(--hm-radius-lg);
    box-shadow: var(--hm-shadow);
  }
  .error-logo { width: 68px; height: 68px; margin: 0 auto 22px; display: block; border-radius: 50%; }
  .error-code {
    margin: 0;
    font-family: var(--serif-h1);
    font-size: clamp(56px, 16vw, 104px);
    line-height: 1;
    letter-spacing: .04em;
    color: var(--hm-accent);
  }
  .error-card h1 { margin: 14px 0 10px; font-size: clamp(1.4rem, 4vw, 1.9rem); }
  .error-card p { margin: 0 0 26px; color: var(--hm-ink-soft); }
  .error-links { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--hm-line); }
  .error-links p { margin: 0 0 10px; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; }
  .error-links ul {
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: center;
  }
  .error-links a { color: var(--hm-accent-ink); text-decoration: underline; }
</style>
<link rel="stylesheet" href="/css/sitio-2026.css" />
</head>
<body class="site-2026">
<main class="error-wrap">

    <h1>Esta página no existe</h1>

    <a href="/" class="btn gold">Ir a la portada</a>

    <div class="error-links">

      <ul>
        <li><a href="/#nosotros">Quiénes somos</a></li>

        <li><a href="https://chbeta.pages.dev/login.html" target="_blank" rel="noopener">Acceso socios</a></li>
      </ul>
    </div>
  </div>
</main>
