<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Página no encontrada · AG Casco Histórico</title>
<meta name="robots" content="noindex, follow" />
<meta name="description" content="La página que buscas no existe o cambió de dirección." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<meta name="theme-color" content="#391e14" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/estilos.css" />
<style>
  .error { min-height: 100svh; display: grid; place-items: center; padding: 40px 0; }
  .error-caja {
    width: min(540px, 100%);
    padding: clamp(30px, 6vw, 54px);
    text-align: center;
    background: #fffdf8;
    border: 1px solid var(--linea);
    border-radius: var(--radio);
    box-shadow: var(--sombra);
  }
  .error-caja img { width: 66px; height: 66px; margin: 0 auto 22px; border-radius: 50%; }
  .error-numero {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(54px, 15vw, 96px);
    line-height: 1;
    letter-spacing: .05em;
    color: var(--dorado);
  }
  .error-caja h1 {
    margin: 12px 0 10px;
    font-family: var(--serif);
    font-size: clamp(1.4rem, 4vw, 1.9rem);
    font-weight: 600;
  }
  .error-caja > p { margin: 0 0 28px; color: var(--tinta-suave); }
  .error-enlaces { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--linea); }
  .error-enlaces p {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--madera);
  }
  .error-enlaces ul {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    justify-content: center;
    list-style: none;
    margin: 0;
    padding: 0;
  }
</style>
</head>
<body>
<main class="error">
  <div class="contenedor">
    <div class="error-caja">
      <a href="/" aria-label="Ir a la portada">
        <img src="/assets/logo-casco-historico-2026.webp" alt="Agrupación Gremial Casco Histórico de Puente Alto" width="66" height="66" />
      </a>

      <p class="error-numero">404</p>
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace esté mal escrito o que la página haya cambiado de dirección.</p>

      <a href="/" class="boton principal">Ir a la portada</a>

      <div class="error-enlaces">
        <p>O prueba con</p>
        <ul>
          <li><a href="/#quienes">Quiénes somos</a></li>
          <li><a href="/#pilares">Qué hacemos</a></li>
          <li><a href="/#historia">Historia</a></li>
          <li><a href="/#contacto">Contacto</a></li>
        </ul>
      </div>
    </div>
  </div>
</main>
</body>
</html>
